name: Pull request checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build and verify package
        run: npm run package

      - name: Check ZIP archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -qx 'index.html'
          unzip -Z1 "$archive" | grep -q '^assets/'

      - name: Install browser smoke tooling
        id: playwright
        run: |
          set -euo pipefail
          bin="$(npx --yes --package=playwright@1.56.1 -c 'command -v playwright')"
          test -n "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          npx --yes --package=playwright@1.56.1 -- playwright install --with-deps chromium

      - name: Browser smoke test
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 > /tmp/cfsm-sao-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/cfsm-sao-preview.log
            exit 1
          fi
          PLAYWRIGHT_BIN="${{ steps.playwright.outputs.bin }}" SMOKE_URL=http://127.0.0.1:4173/ node scripts/browser-smoke.mjs

      - name: Large node performance smoke
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/cfsm-sao-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/cfsm-sao-dev.log
            exit 1
          fi
          PLAYWRIGHT_BIN="${{ steps.playwright.outputs.bin }}" PERF_BASE_URL=http://127.0.0.1:5173/ node scripts/browser-perf-smoke.mjs
